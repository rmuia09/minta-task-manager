name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  API_BASE_URL: "https://minta-task-manager-api.onrender.com/"
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ADB_INSTALL_TIMEOUT: 120

jobs:
  test-api:
    name: API Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qa-tests/package-lock.json

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Start backend for API tests
        run: |
          cd backend && npm ci
          nohup node server.js > ../backend.log 2>&1 &
          sleep 5
          curl -s http://localhost:3000/health > /dev/null || { cat ../backend.log; exit 1; }

      - name: Run API tests (Jest)
        run: cd qa-tests && API_BASE_URL="http://localhost:3000" npm run test:api

  test-ui:
    name: UI Tests (Appium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qa-tests/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ hashFiles('**/*.gradle.kts') }}-v1

      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          mkdir -p $SDK_DIR/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/emulator" >> $GITHUB_PATH

          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses >/dev/null 2>&1 || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
            "platform-tools" "emulator" "build-tools;34.0.0" "platforms;android-34" \
            "system-images;android-30;google_apis;x86_64"

      - name: Create Android emulator (AVD)
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          echo "y" | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "system-images;android-30;google_apis;x86_64"
          echo "no" | $SDK_DIR/cmdline-tools/latest/bin/avdmanager create avd -n test-avd \
            -k "system-images;android-30;google_apis;x86_64" --device "pixel_3a"
          $SDK_DIR/emulator/emulator -list-avds

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}-v1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug "-PAPI_BASE_URL=${{ env.API_BASE_URL }}"

      - name: Start Android emulator
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          $SDK_DIR/emulator/emulator -avd test-avd -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim &
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed | tr -d "\r") ]]; do sleep 1; done; input keyevent 82'

      - name: Install Appium
        run: npm install -g appium@2

      - name: Install Appium UiAutomator2 driver
        run: appium driver install uiautomator2

      - name: Install APK on emulator
        run: adb install -r android/app/build/outputs/apk/debug/app-debug.apk

      - name: Start Appium server
        run: appium > appium.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:4723/status > /dev/null || { cat appium.log; exit 1; }

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Run UI tests (Appium)
        run: cd qa-tests && API_BASE_URL="${{ env.API_BASE_URL }}" npx wdio run wdio.ci.conf.js

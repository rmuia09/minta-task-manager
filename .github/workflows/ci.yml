name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  API_BASE_URL: "https://minta-task-manager-api.onrender.com/"
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_NAME: test-avd
  ANDROID_SYSTEM_IMAGE: "system-images;android-30;google_apis;x86_64"

jobs:
  test-api:
    name: API Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Start backend for API tests
        run: |
          cd backend && npm ci
          nohup node server.js > ../backend.log 2>&1 &
          sleep 5
          curl -s http://localhost:3000/health > /dev/null || { cat ../backend.log; exit 1; }

      - name: Run API tests (Jest)
        run: cd qa-tests && API_BASE_URL="http://localhost:3000" npm run test:api

  test-ui:
    name: UI Tests (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          mkdir -p $SDK_DIR/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/emulator" >> $GITHUB_PATH

          echo "=== Accepting SDK licenses ==="
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses >/dev/null 2>&1 || true

          echo "=== Installing platform-tools ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools"

          echo "=== Installing emulator ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "emulator"

          echo "=== Installing build-tools;34.0.0 ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "build-tools;34.0.0"

          echo "=== Installing platforms;android-34 ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platforms;android-34"

          echo "=== Installing system image (with retry) ==="
          for i in 1 2 3; do
            echo "Attempt $i: ${{ env.ANDROID_SYSTEM_IMAGE }}"
            if $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "${{ env.ANDROID_SYSTEM_IMAGE }}"; then
              echo "System image installed successfully on attempt $i"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 10
            fi
          done

      - name: Create Android emulator (AVD)
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          export ANDROID_SDK_ROOT=$SDK_DIR
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME

          echo "=== Installing system image ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "${{ env.ANDROID_SYSTEM_IMAGE }}"

          echo "=== Creating AVD ==="
          echo "no" | $SDK_DIR/cmdline-tools/latest/bin/avdmanager create avd \
            -n "${{ env.ANDROID_AVD_NAME }}" \
            -k "${{ env.ANDROID_SYSTEM_IMAGE }}" --device "pixel_3a" --force

          echo "=== Listing AVDs ==="
          $SDK_DIR/emulator/emulator -list-avds
          ls -la $ANDROID_AVD_HOME/

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}-v1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug "-PAPI_BASE_URL=${{ env.API_BASE_URL }}"

      - name: Start Android emulator
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          export ANDROID_SDK_ROOT=$SDK_DIR
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_AVD_HOME=$HOME/.android/avd

          echo "=== AVDs available ==="
          $SDK_DIR/emulator/emulator -list-avds

          $SDK_DIR/emulator/emulator -avd "${{ env.ANDROID_AVD_NAME }}" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -wipe-data -accel off > emulator.log 2>&1 &

          if ! timeout 300 adb wait-for-device; then
            echo "::error::Emulator did not register with adb within 5 minutes."
            cat emulator.log
            exit 1
          fi

          if ! timeout 300 adb shell 'while [ -z "$(getprop sys.boot_completed | tr -d "\r")" ]; do sleep 2; done'; then
            echo "::error::Emulator did not finish booting within 5 minutes."
            cat emulator.log
            exit 1
          fi

          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell svc power stayon true || true

          adb devices
          adb shell getprop ro.build.version.sdk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          maestro --version

      - name: Install APK on emulator
        run: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk

      - name: Register test users via API
        run: |
          cd backend && npm ci
          nohup node server.js > ../backend.log 2>&1 &
          sleep 5
          curl -s http://localhost:3000/health > /dev/null || { cat ../backend.log; exit 1; }

          REGISTER_RESP=$(curl -s -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"UI Tester","email":"maestro-login@example.com","password":"Password123!"}')
          echo "$REGISTER_RESP"
          echo "UI_LOGIN_EMAIL=maestro-login@example.com" >> $GITHUB_ENV
          echo "UI_LOGIN_PASSWORD=Password123!" >> $GITHUB_ENV
          echo "UI_TASK_TITLE=Maestro Task $(date +%s)" >> $GITHUB_ENV

          FORGOT_RESP=$(curl -s -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"UI Forgot","email":"maestro-forgot@example.com","password":"Password123!"}')
          echo "$FORGOT_RESP"
          echo "UI_FORGOT_EMAIL=maestro-forgot@example.com" >> $GITHUB_ENV
          echo "UI_REGISTER_EMAIL=maestro-register-$(date +%s)@example.com" >> $GITHUB_ENV

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Run UI tests (Maestro)
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          cd qa-tests
          maestro test maestro/register.yaml
          maestro test maestro/login.yaml
          maestro test maestro/tasks.yaml
          maestro test maestro/forgot-password.yaml

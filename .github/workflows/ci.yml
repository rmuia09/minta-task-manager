name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  API_BASE_URL: "https://minta-task-manager-api.onrender.com/"
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ADB_INSTALL_TIMEOUT: 120
  # The system image below is API 30, which is Android 11. Appium's
  # platformVersion capability expects the Android version, not the API level.
  ANDROID_API_LEVEL: "30"
  ANDROID_VERSION: "11"
  ANDROID_SYSTEM_IMAGE: "system-images;android-30;google_apis;x86_64"
  ANDROID_AVD_NAME: "test-avd"
  # The Appium server must look for the UiAutomator2 driver in this location.
  APPIUM_HOME: ${{ github.workspace }}/.appium-home

jobs:
  test-api:
    name: API Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qa-tests/package-lock.json

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Start backend for API tests
        run: |
          cd backend && npm ci
          nohup node server.js > ../backend.log 2>&1 &
          sleep 5
          curl -s http://localhost:3000/health > /dev/null || { cat ../backend.log; exit 1; }

      - name: Run API tests (Jest)
        run: cd qa-tests && API_BASE_URL="http://localhost:3000" npm run test:api

  test-ui:
    name: UI Tests (Appium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qa-tests/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ hashFiles('**/*.gradle.kts') }}-v1

      - name: Enable KVM for the emulator
        run: |
          # GitHub-hosted runners expose /dev/kvm only for members of the kvm group.
          # Without this the emulator aborts with
          # "x86_64 emulation currently requires hardware acceleration!".
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing on this runner; hardware acceleration is impossible."
            exit 1
          fi
          sudo usermod -aG kvm "$(id -un)" || true
          sudo chown "$(id -un)":"$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm
          ls -l /dev/kvm

      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          mkdir -p $SDK_DIR/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/emulator" >> $GITHUB_PATH

          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses >/dev/null 2>&1 || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
            "platform-tools" "emulator" "build-tools;35.0.0" "platforms;android-35" \
            "${{ env.ANDROID_SYSTEM_IMAGE }}"

      - name: Create Android emulator (AVD)
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          export ANDROID_SDK_ROOT=$SDK_DIR
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME

          echo "=== Installing system image ==="
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "${{ env.ANDROID_SYSTEM_IMAGE }}"

          echo "=== Creating AVD ==="
          echo "no" | $SDK_DIR/cmdline-tools/latest/bin/avdmanager create avd \
            -n "${{ env.ANDROID_AVD_NAME }}" \
            -k "${{ env.ANDROID_SYSTEM_IMAGE }}" --device "pixel_3a" --force

          echo "=== Listing AVDs ==="
          $SDK_DIR/emulator/emulator -list-avds
          ls -la $ANDROID_AVD_HOME/

      - name: Verify emulator acceleration
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          # The emulator refuses to start without KVM; fail fast with a clear message.
          $SDK_DIR/emulator/emulator -accel-check || {
            echo "::error::Hardware acceleration unavailable. Check that /dev/kvm is accessible."; exit 1; }

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}-v1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug "-PAPI_BASE_URL=${{ env.API_BASE_URL }}"

      - name: Start Android emulator
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          export ANDROID_SDK_ROOT=$SDK_DIR
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_AVD_HOME=$HOME/.android/avd

          echo "=== AVDs available ==="
          $SDK_DIR/emulator/emulator -list-avds

          # Hardware acceleration is required for x86_64 images; the KVM step above enables it.
          $SDK_DIR/emulator/emulator -avd "${{ env.ANDROID_AVD_NAME }}" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -wipe-data > emulator.log 2>&1 &

          # Wait for adb to see a device, but never hang until the job timeout.
          if ! timeout 300 adb wait-for-device; then
            echo "::error::Emulator did not register with adb within 5 minutes."
            cat emulator.log
            exit 1
          fi

          # Wait for the framework to finish booting, also bounded.
          # Uses POSIX sh syntax because `adb shell` runs mksh, not bash.
          if ! timeout 300 adb shell 'while [ -z "$(getprop sys.boot_completed | tr -d "\r")" ]; do sleep 2; done'; then
            echo "::error::Emulator did not finish booting within 5 minutes."
            cat emulator.log
            exit 1
          fi

          # Wake the emulator and dismiss the keyguard. Without this the screen
          # stays asleep and uiautomator cannot see any app UI, so every
          # selector lookup fails with "no such element".
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell svc power stayon true || true

          adb devices
          adb shell getprop ro.build.version.sdk

      - name: Install Appium
        run: npm install -g appium@2

      - name: Install Appium UiAutomator2 driver
        # Pin the driver to the version that supports the Appium 2.x server.
        # Installing "latest" pulls a 4.x beta that requires Appium ^4.0.0-beta.8
        # and fails with "cannot be installed because the server version it requires
        # does not meet the currently installed one".
        run: |
          mkdir -p "$APPIUM_HOME"
          appium driver install uiautomator2@3.10.0
          appium driver list --installed

      - name: Install APK on emulator
        run: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          # Start the app so it is in the foreground and rendering when the
          # tests begin.
          adb shell am start -W -n com.example.taskmanager/.MainActivity || true
          sleep 3
          adb shell dumpsys window | grep -E 'mCurrentFocus' || true

      - name: Start Appium server
        run: |
          appium > appium.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:4723/status > /dev/null || { cat appium.log; exit 1; }
          # The driver is reported in the startup log, not in /status.
          grep -q "automationName 'UiAutomator2'" appium.log || {
            echo "::error::UiAutomator2 driver was not loaded by the Appium server."; cat appium.log; exit 1; }

      - name: Install QA test dependencies
        run: cd qa-tests && npm install

      - name: Run UI tests (Appium)
        run: |
          cd qa-tests
          API_BASE_URL="${{ env.API_BASE_URL }}" \
          APPIUM_PLATFORM_VERSION="${{ env.ANDROID_VERSION }}" \
          npx wdio run wdio.ci.conf.js --autoCompileOpts.autoCompile=false
